name: Sync Data Files

on:
  push:
    branches:
      - kyc-docs
    paths:
      - 'data/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kyc-docs
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Sync data files to root level
        run: |
          # Copy data/*.json to root-level files (no extension)
          for f in data/*.json; do
            name=$(basename "$f" .json)
            cp "$f" "$name"
            echo "Synced $f → $name"
          done
          
          # Also sync pwd files
          for f in data/pwd_*.json; do
            if [ -f "$f" ]; then
              name=$(basename "$f" .json)
              cp "$f" "$name"
              echo "Synced $f → $name"
            fi
          done
          
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Auto-sync data files to root level"
          git push
